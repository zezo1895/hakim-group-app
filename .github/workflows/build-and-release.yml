name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes (e.g., fixed bugs, new features)'
        required: true
        default: 'Automated CI build'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Extract version from app.json
        id: extract_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build APK locally via EAS
        run: |
          eas build --platform android --profile preview --local --non-interactive --output app-release.apk

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Hakim App v${{ env.VERSION }}
          body: ${{ github.event.inputs.release_notes }}
          files: app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Release Asset Download URL
        id: get_url
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}-${{ github.run_number }}/app-release.apk"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Update Backend Version
        run: |
          curl -X POST https://hakim-production-3e6c.up.railway.app/api/app-version/ci-update \
          -H "Content-Type: application/json" \
          -d "{\"version\": \"${{ env.VERSION }}\", \"downloadUrl\": \"${{ env.DOWNLOAD_URL }}\", \"secret\": \"hakim_ci_secret_2024_secure\"}"
