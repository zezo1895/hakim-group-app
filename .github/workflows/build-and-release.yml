name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      release_message:
        description: 'Release Notes / Message'
        required: true
        default: 'New update available'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build APK with EAS
        run: eas build --platform android --profile preview --non-interactive --local
        # Note: --local builds it directly on the GitHub Runner! 100% free, doesn't use your Expo quota.

      - name: Find the built APK
        id: find_apk
        run: |
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "apk_path=$APK_FILE" >> $GITHUB_ENV
          
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "app_version=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.app_version }}-${{ github.run_number }}
          name: Release v${{ env.app_version }}
          body: ${{ github.event.inputs.release_message }}
          files: ${{ env.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Direct Download Link to Backend
        run: |
          APK_BASENAME=$(basename "${{ env.apk_path }}")
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/v${{ env.app_version }}-${{ github.run_number }}/$APK_BASENAME"
          
          echo "Asset URL: $ASSET_URL"
          
          curl -X POST https://hakim-production-3e6c.up.railway.app/api/app-version/ci-update \
          -H "Content-Type: application/json" \
          -H "x-ci-secret: hakim_ci_super_secret_999" \
          -d "{\"version\": \"${{ env.app_version }}\", \"downloadUrl\": \"$ASSET_URL\"}"
