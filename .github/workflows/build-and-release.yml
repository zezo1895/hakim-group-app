name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes (e.g., fixed bugs, new features)'
        required: true
        default: 'Automated CI build'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Auto-bump version
        id: auto_bump
        run: |
          # Read current version
          CURRENT=$(node -p "require('./app.json').expo.version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "Bumping version: $CURRENT → $NEW_VERSION"
          
          # Update app.json with new version using node
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$NEW_VERSION';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          
          # Commit the version bump back to the repository
          git config user.name "GitHub Actions CI"
          git config user.email "actions@github.com"
          git add app.json
          git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push origin main
          
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Build APK locally via EAS
        env:
          _JAVA_OPTIONS: "-XX:MaxMetaspaceSize=1g -Xmx4g"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC\""
        run: |
          eas build --platform android --profile preview --local --non-interactive --output app-release.apk

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Hakim App v${{ env.VERSION }}
          body: ${{ github.event.inputs.release_notes }}
          files: app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Release Asset Download URL
        id: get_url
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}-${{ github.run_number }}/app-release.apk"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Update Backend Version
        run: |
          curl -X POST https://hakim-production-5171.up.railway.app/api/app-version/ci-update \
          -H "Content-Type: application/json" \
          -H "x-ci-secret: hakim_ci_super_secret_999" \
          -d "{\"version\": \"${{ env.VERSION }}\", \"downloadUrl\": \"${{ env.DOWNLOAD_URL }}\"}"
